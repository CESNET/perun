maven-build:
  tags:
    - k8s-1s
  script:
    - PGPASSWORD=test psql -1 -q -h db -p 5432 -U perun -d perun  < perun-base/src/test/resources/test-schema.sql
    - mvn -DDB_DRIVER=org.postgresql.Driver -DDB_URL=jdbc:postgresql://db:5432/perun -DDB_USERNAME=perun -DDB_PASSWORD=test clean install
  services:
    - name: ${CI_DEPENDENCY_PROXY_DIRECT_GROUP_IMAGE_PREFIX}/bitnami/postgresql:latest
      alias: db
      variables:
        POSTGRESQL_USERNAME: perun
        POSTGRESQL_PASSWORD: test
        POSTGRESQL_DATABASE: perun
        HEALTHCHECK_TCP_PORT: "5432"

# Publish dev (SNAPSHOT) packages to GitLab Package Registry on main branch merges (under <CURRENT_VERSION>-SNAPSHOT):
deploy:
  stage: deploy
  image: registry.gitlab.ics.muni.cz:443/perun/ci/pipeline-components/maven:3-eclipse-temurin-21
  script:
    # Gets latest release tag from upstream
    - |
      LATEST_TAG="$(
        git ls-remote --tags --refs origin 'v*' \
          | awk -F/ '{print $NF}' \
          | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -V \
          | tail -n1
      )"

      if [ -z "$LATEST_TAG" ]; then
        echo "No release tag found"
        exit 1
      fi

      RELEASE_VERSION="${LATEST_TAG#v}"
      SNAPSHOT_VERSION="${RELEASE_VERSION}-SNAPSHOT"

      echo "Latest release tag: ${LATEST_TAG}"
      echo "Publishing perun-openapi as ${SNAPSHOT_VERSION}"
    # Set version in pom.xml to <version>-SNAPSHOT
    - mvn -B -s ci_settings.xml versions:set -DnewVersion="${SNAPSHOT_VERSION}" -DgenerateBackupPoms=false
    - 'mvn deploy -s ci_settings.xml -DskipTests'
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule' && $CI_PIPELINE_SOURCE != 'trigger'"

openapi-lint:
  stage: test
  image: registry.gitlab.ics.muni.cz:443/perun/ci/pipeline-components/expo:latest
  script:
    - npm install -g @quobix/vacuum
    - vacuum lint -d -e -a perun-openapi/openapi.yml
